# WebSocket load balancing for the gate tier.
#
# No sticky sessions and no ip_hash: a reconnecting client may land on any
# gate and resume there (SESSION_CROSS_GATE_RESUME=true), so plain
# least_conn gives the most even spread.
worker_processes auto;
events {
  worker_connections 20480;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream gates {
    least_conn;
    server gate-1:7000 max_fails=2 fail_timeout=5s;
    server gate-2:7000 max_fails=2 fail_timeout=5s;
    keepalive 64;
  }

  server {
    listen 80;

    location /ws {
      proxy_pass http://gates;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      # The gate reads the client ip from this header (WS_TRUST_PROXY=true).
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;

      # Long-lived connections: never time out an idle-but-alive socket.
      # The gate has its own ping/pong liveness check.
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_buffering off;
    }

    # The load balancer's own liveness. Gate health lives on each gate's
    # admin port (default WS_PORT + 1000) and must stay on the internal
    # network - it also serves the /admin/* endpoints.
    location = /healthz {
      access_log off;
      add_header content-type application/json always;
      return 200 '{"ok":true,"lb":"nginx"}';
    }
  }
}
